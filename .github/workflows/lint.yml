name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Check syntax
        run: |
          for f in bin/coop install.sh lib/*.sh docker/entrypoint.sh tests/unit.sh tools/*.sh; do
            bash -n "$f" || exit 1
          done
          sh -n docker/coop-cmd
          sh -n docker/healthcheck.sh

      - name: ShellCheck
        run: |
          shellcheck --shell=bash --severity=warning \
            bin/coop install.sh lib/*.sh docker/entrypoint.sh tests/unit.sh
          shellcheck --shell=sh --severity=warning \
            docker/coop-cmd docker/healthcheck.sh

  selfcheck:
    name: Configuration self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # xmlstarlet for the mod manifest checks in tests/unit.sh.
      - name: Install jq and xmlstarlet
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq xmlstarlet

      # Proves that config/defaults.env and the specification in
      # lib/config.sh describe exactly the same set of settings. Without
      # this the two drift apart silently and a new setting ends up with
      # no default.
      - name: defaults.env matches the spec
        run: |
          COOP_ROOT="$PWD" bash -c '
            set -euo pipefail
            COOP_ROOT="$PWD"
            . lib/common.sh; . lib/output.sh; . lib/config.sh
            config_selfcheck
            echo "spec and defaults.env agree ($(config_keys | wc -l) settings)"
          '

      - name: Every setting has a valid default
        run: |
          COOP_ROOT="$PWD" bash -c '
            set -euo pipefail
            COOP_ROOT="$PWD"
            . lib/common.sh; . lib/output.sh; . lib/config.sh
            config_load
            config_validate_all
            echo "all defaults validate"
          '

      # The configuration file is parsed, never sourced. This proves it,
      # so the guarantee cannot quietly regress.
      - name: Configuration is never executed
        run: |
          COOP_ROOT="$PWD" bash -c '
            set -euo pipefail
            COOP_ROOT="$PWD"
            . lib/common.sh; . lib/output.sh; . lib/config.sh
            printf "SAVE_NAME=\$(touch /tmp/pwned)\n" > /tmp/evil.env
            config_parse_file config/defaults.env
            config_parse_file /tmp/evil.env
            if [ -e /tmp/pwned ]; then echo "FAIL: the config file was executed"; exit 1; fi
            [ "${CFG[SAVE_NAME]}" = "\$(touch /tmp/pwned)" ] || { echo "FAIL: value was altered"; exit 1; }
            echo "config values are data, not code"
          '

      # Escaping on write must be the exact inverse of unescaping on read,
      # or a password with a backslash grows one on every save.
      - name: Values survive a write/read round trip
        run: |
          COOP_ROOT="$PWD" bash -c '
            set -euo pipefail
            COOP_ROOT="$PWD"
            . lib/common.sh; . lib/output.sh; . lib/config.sh
            export INSTALL_DIR=/tmp/rt; mkdir -p /tmp/rt/config
            CFG_OVERRIDE[INSTALL_DIR]=/tmp/rt
            config_load
            ORIG="p&ss\\w\"ord\$(x)\`y\`  end"
            cfg_set SERVER_PASSWORD "$ORIG"
            for _ in 1 2 3; do
              config_persist "$FILE_CONFIG" SERVER_PASSWORD
              CFG=(); config_load
            done
            [ "$(cfg SERVER_PASSWORD)" = "$ORIG" ] || { echo "FAIL: value drifted"; exit 1; }
            echo "round trip is stable"
          '

      # The interactive installer collects answers into CFG and then has to
      # recompute the derived paths, because the advanced questions can
      # move the installation directory. Doing that with config_load reads
      # defaults.env back over the answers, and the installer silently
      # ignores everything the user typed.
      - name: Collected answers survive path derivation
        run: |
          COOP_ROOT="$PWD" bash -c '
            set -euo pipefail
            COOP_ROOT="$PWD"
            for m in common output config state docker server license bans campaign steam compat backup update; do
              . "lib/$m.sh"
            done
            config_load
            cfg_set SAVE_NAME "typed by the user"
            cfg_set SERVER_PASSWORD "s3cret"
            cfg_set INSTALL_DIR "/srv/elsewhere"
            config_derive_paths
            [ "$(cfg SAVE_NAME)" = "typed by the user" ] || { echo "FAIL: the campaign name was discarded"; exit 1; }
            [ "$(cfg SERVER_PASSWORD)" = "s3cret" ]       || { echo "FAIL: the password was discarded"; exit 1; }
            [ "$DIR_SAVES" = "/srv/elsewhere/saves" ]     || { echo "FAIL: paths were not recomputed"; exit 1; }
            echo "answers survive, paths follow the new directory"
          '

      # Whether a player's difficulty settings survive a new Coop build
      # comes down to this one function. The fixtures in tests/modconfig
      # describe the expected outcome.
      - name: Gameplay configuration merge
        run: |
          COOP_ROOT="$PWD" bash -c '
            set -euo pipefail
            COOP_ROOT="$PWD"
            for m in common output config state docker server license bans campaign steam compat backup update; do
              . "lib/$m.sh"
            done
            out=/tmp/merged.json; rep=/tmp/report.txt
            modconfig_merge tests/modconfig/previous.json tests/modconfig/new.json "$out" "$rep"

            fail() { echo "FAIL: $1"; echo "--- merged ---"; cat "$out"; echo "--- report ---"; cat "$rep"; exit 1; }

            grep -q "\"playerReceivedDamage\": \"Realistic\"" "$out" || fail "a changed value was not carried over"
            grep -q "\"battleSize\": 500"                     "$out" || fail "a changed value was not carried over"
            grep -q "\"enableHeroExecutions\": false"          "$out" || fail "a changed value was not carried over"
            grep -q "\"addedInNewBuild\": \"Balanced\""        "$out" || fail "a setting new in this build was lost"
            if grep -q "goneInNewBuild" "$out"; then fail "a setting the build dropped came back"; fi
            grep -qx "added addedInNewBuild"   "$rep" || fail "the new setting was not reported"
            grep -qx "removed goneInNewBuild"  "$rep" || fail "the dropped setting was not reported"
            grep -q "NEW IN THIS BUILD"        "$out" || fail "comments from the new file were lost"

            new_n=$(grep -cE "^[[:space:]]*\"[A-Za-z0-9_]+\"[[:space:]]*:" tests/modconfig/new.json)
            got_n=$(grep -cE "^[[:space:]]*\"[A-Za-z0-9_]+\"[[:space:]]*:" "$out")
            [ "$new_n" = "$got_n" ] || fail "setting count changed: $new_n -> $got_n"

            echo "values carried over, new keys adopted, dropped keys gone, comments intact"
          '

      # Gameplay settings across builds, license acceptance, the ban list
      # and campaign switching. A mistake in any of them is silent until it
      # costs somebody a campaign or accepts terms nobody read, so each
      # check names the promise it holds the code to.
      - name: Unit checks
        run: bash tests/unit.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      # The settings table in docs/CONFIGURATION.md is generated from the
      # spec and the defaults, so it cannot describe a setting that does
      # not exist or miss one that does.
      - name: Settings table is current
        run: tools/gen-config-docs.sh --check

      # Command names, configuration keys and links are the three things
      # that drift silently between code and prose.
      - name: Documentation matches the implementation
        run: tools/check-docs.sh

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config parses
        run: |
          cat > /tmp/compose.env <<'EOF'
          COMPOSE_PROJECT_NAME=bannerlordcoop-ci
          COOP_CONTAINER_NAME=bannerlordcoop-ci
          COOP_INSTALL_DIR=/tmp/bannerlordcoop
          COOP_GAME_PORT=4200
          COOP_PUID=1000
          COOP_PGID=1000
          COOP_TZ=UTC
          COOP_WINE_BRANCH=stable
          COOP_MEMORY_LIMIT=0
          COOP_LOG_MAX_SIZE=50m
          COOP_LOG_MAX_FILES=5
          EOF
          docker compose --env-file /tmp/compose.env -f compose.yaml config >/dev/null
          echo "compose.yaml is valid"
